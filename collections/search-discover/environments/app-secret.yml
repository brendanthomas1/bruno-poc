name: app-secret
variables:
  - name: baseUrl
    value: https://api.themoviedb.org/3
  - secret: true
    name: tmdbToken
    description: Secret variable. Type the token into the Bruno app; it is encrypted on your machine and never written to this file. On the CLI, pass --env-var tmdbToken=... instead.
  - name: language
    value: en-US
  - name: region
    value: US
  - name: maxResponseTimeMs
    value: "3000"
