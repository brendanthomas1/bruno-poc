info:
  name: Get episode details
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tv/:series_id/season/:season_number/episode/:episode_number?language={{language}}"
  params:
    - name: language
      value: "{{language}}"
      type: query
    - name: series_id
      value: "{{seriesId}}"
      type: path
    - name: season_number
      value: "{{seasonNumber}}"
      type: path
    - name: episode_number
      value: "{{episodeNumber}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.season_number
      operator: eq
      value: "{{seasonNumber}}"
    - expression: res.body.episode_number
      operator: eq
      value: "{{episodeNumber}}"
    - expression: res.body.name
      operator: isString
  scripts:
    - type: tests
      code: |-
        const ep = res.getBody();

        test("has air date, runtime and crew", function () {
          expect(ep.air_date).to.match(/^\d{4}-\d{2}-\d{2}$/);
          expect(ep).to.have.property("runtime");
          expect(ep.crew).to.be.an("array");
          expect(ep.guest_stars).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Get episode details

  `GET /tv/{series_id}/season/{season_number}/episode/{episode_number}`.
