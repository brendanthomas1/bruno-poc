info:
  name: List TV genres
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/genre/tv/list?language={{language}}"
  params:
    - name: language
      value: "{{language}}"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.genres
      operator: isNotEmpty
  scripts:
    - type: tests
      code: |-
        test("every genre has a numeric id and a name", function () {
          res.getBody().genres.forEach(function (g) {
            expect(g.id).to.be.a("number");
            expect(g.name).to.be.a("string").and.not.be.empty;
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # List TV genres

  `GET /genre/tv/list`. TV genres differ from movie genres (for example, "Sci-Fi & Fantasy" is 10765).
