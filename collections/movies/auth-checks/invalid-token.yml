info:
  name: Invalid token is rejected (401)
  type: http
  seq: 1
  tags:
    - negative

http:
  method: GET
  url: "{{baseUrl}}/movie/:movie_id"
  params:
    - name: movie_id
      value: "{{movieId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Invalid token is rejected (401)

  Uses `auth: inherit`, so it gets the **folder's** fake bearer token, not the
  collection's real one. TMDB must answer **401**.
